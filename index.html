{q:"¿Cuál de las siguientes situaciones es aleatoria?",t:"a",o:[{x:"Ana programa el horno durante 30 minutos. El temporizador finalizará al completar ese tiempo.",k:"d"},{x:"Luis quiere conocer la duración exacta de su viaje al trabajo, aunque el tránsito cambia cada día.",k:"a"},{x:"Una empresa coloca 24 botellas en seis cajas iguales. Cada caja contendrá cuatro.",k:"d"}],e:"El tránsito presenta variaciones. No se conoce con certeza la duración exacta del viaje."},

function attachDrag(){document.querySelectorAll(".sort-card").forEach(el=>el.addEventListener("dragstart",e=>e.dataTransfer.setData("text/plain",el.dataset.id)));document.querySelectorAll(".basket").forEach(el=>{el.addEventListener("dragover",e=>e.preventDefault());el.addEventListener("drop",e=>{e.preventDefault();place(e.dataTransfer.getData("text/plain"),el.dataset.kind)})})}
function exitGame(){stopSpeech(false);clearInterval(timer);window.close();setTimeout(()=>{if(!window.closed)window.location.replace("about:blank")},160)}
app.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,v=b.dataset.value;if(a==="speak")speakInstructions();else if(a==="stop-audio")stopSpeech();else if(a==="start"){audio=new (window.AudioContext||window.webkitAudioContext)();audio.resume();const newStarter=pickStarter(PEOPLE,S.openingStarter);S.players=PEOPLE.slice();S.starter=newStarter;S.openingStarter=newStarter;S.round=1;S.time=15;S.chosen=null;S.exploded=false;S.phase="game";startTimer();render()}else if(a==="answer")finishTurn(v);else if(a==="classify"){S.classChoice=v;if(v==="A")setTimeout(()=>{S.phase="lesson";render()},700);render()}else if(a==="practice-start"){S.phase="practice";S.pIndex=0;S.pChoice=null;S.pCorrect=0;render()}else if(a==="practice-answer"){if(S.pChoice!==null)return;S.pChoice=+v;const item=PRACTICE[(S.practiceSet*3+S.pIndex)%PRACTICE.length],ok=item.o[S.pChoice].k===item.t;S.score+=ok?10:-10;if(ok)S.pCorrect++;render()}else if(a==="practice-next"){if(S.pIndex===2){S.phase="practiceDone";render();setTimeout(()=>speakInstructions(true),420)}else{S.pIndex++;S.pChoice=null;render()}}else if(a==="practice-new"){S.practiceSet=(S.practiceSet+1)%(PRACTICE.length/3);S.pIndex=0;S.pChoice=null;S.pCorrect=0;S.phase="practice";render()}else if(a==="sorting-start"){S.sortSet=0;S.sorted={};S.selected=null;S.sCorrect=0;S.message="Selecciona o arrastra una tarjeta hacia la canasta correcta.";S.phase="sorting";render()}else if(a==="sort-select"){S.selected=b.dataset.id;render()}else if(a==="basket")place(S.selected,b.dataset.kind);else if(a==="sorting-new"){S.sortSet=(S.sortSet+1)%SORTING.length;S.sorted={};S.selected=null;S.sCorrect=0;S.message="Selecciona o arrastra una tarjeta hacia la canasta correcta.";S.phase="sorting";render()}else if(a==="finish"){S.phase="final";render();setTimeout(()=>speakInstructions(true),420)}else if(a==="exit")exitGame();else if(a==="restart")restart()});
window.addEventListener("beforeunload",()=>stopSpeech(false));
render();
})();
</script>
</body>
